name: A translation to correct
description: Wording in Nepali or Spanish (or English) that's wrong, unclear or unnatural
labels: [translation]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language
      options: [Nepali, Spanish, English]
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where it appears, what it says, and what it should say
    validations:
      required: true
