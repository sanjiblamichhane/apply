# Migrations for apply's database. The URL comes from APPLY_DATABASE_URL (or `apply migrate`).
#
#   uv run apply migrate                                       (upgrade to head)
#   uv run alembic revision --autogenerate -m "..."              (then read and tidy what it wrote)
[alembic]
script_location = apply.store.sql:migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
