[project]
name = "apply"
version = "0.1.0"
description = "apply: one workspace for anything you apply for, on your own machine and model"
license = "Apache-2.0"
authors = [{ name = "sanjiblamichhane" }]
maintainers = [{ name = "sanjiblamichhane" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic[email]>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "httpx>=0.28",
    "beautifulsoup4>=4.15",
    "argon2-cffi>=25.1",
    "python-ulid>=4.0",
    "tzdata>=2026.5",
    "google-cloud-storage>=3.0",
    "pypdf>=6.21",
    "python-multipart>=0.0.20",
    "weasyprint>=70.0",
    "tinycss2>=1.5.1",
]

[project.scripts]
apply = "apply.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
]

[project.urls]
Homepage = "https://github.com/sanjiblamichhane/apply"
Source = "https://github.com/sanjiblamichhane/apply"
Issues = "https://github.com/sanjiblamichhane/apply/issues"
Changelog = "https://github.com/sanjiblamichhane/apply/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apply"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--import-mode=importlib -p no:cacheprovider"
markers = [
    "live: uses the real model (set APPLY_LIVE=1)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["apply"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/versions/*.py" = ["E501"]
